<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta
      content="Sign in to CALIX Glass &amp; Aluminum to continue shopping and manage your account."
      name="description"
    />
    <title>Login | CALIX Glass &amp; Aluminum</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../CSS/login.css" rel="stylesheet" />
  </head>
  <body id="top">
    <main
      class="login-shell min-vh-100 d-flex align-items-center justify-content-center p-3 p-md-4"
    >
      <section
        aria-labelledby="loginTitle"
        class="auth-card container-fluid p-0 overflow-hidden shadow-lg"
      >
        <div class="row g-0 min-vh-card">
          <div class="col-12 col-lg-5 bg-white">
            <div class="login-panel d-flex flex-column h-100 p-4 p-sm-5">
              <div
                class="brand-row d-flex align-items-center justify-content-between mb-5"
              >
                <img
                  alt="CALIX Glass and Aluminum"
                  class="brand-logo"
                  src="../Assets/Logo1.png"
                />
              </div>
              <div class="login-copy mb-4">
                <h1 class="display-title mt-2 mb-2" id="loginTitle">
                  Sign In!
                </h1>
                <p class="text-secondary mb-0" id="loginDescription">
                  Browse our products and services, request quotations, and keep
                  your transactions in one simple place.
                </p>
              </div>
              <form class="mt-2" id="loginForm" novalidate="">
                <div class="mb-3">
                  <label class="form-label" for="user">
                    Email or username
                  </label>
                  <div class="input-wrap position-relative">
                    <i class="bi bi-person input-icon"> </i>
                    <input
                      autocomplete="username"
                      class="form-control form-control-lg ps-5"
                      id="user"
                      placeholder="Enter your email or username"
                      required=""
                      type="text"
                    />
                  </div>
                </div>
                <div class="mb-2">
                  <label class="form-label" for="password"> Password </label>
                  <div class="input-wrap position-relative">
                    <i class="bi bi-lock input-icon"> </i>
                    <input
                      autocomplete="current-password"
                      class="form-control form-control-lg ps-5 pe-5"
                      id="password"
                      placeholder="Enter your password"
                      required=""
                      type="password"
                    />
                    <button
                      aria-label="Show password"
                      class="password-eye"
                      id="togglePassword"
                      type="button"
                    >
                      <i class="bi bi-eye"> </i>
                    </button>
                  </div>
                </div>
                <p
                  aria-live="polite"
                  class="error-message mb-3"
                  id="loginError"
                  role="alert"
                ></p>
                <button class="btn btn-calix btn-lg w-100" type="submit">
                  Login
                </button>
                <div class="divider d-flex align-items-center gap-3 my-4">
                  <span> </span>
                  <small> OR </small>
                  <span> </span>
                </div>
              </form>
              <p class="signup-copy text-center mt-4 mb-0" id="signupPrompt">
                  Don't have an account?
                  <button
                    class="btn btn-link signup-link p-0"
                    id="createAccountButton"
                    type="button"
                  >
                    Create account
                  </button>
              </p>
              <form class="register-form mt-2" id="registerForm" hidden>
                <div class="mb-3">
                  <label class="form-label" for="registerName">Full name</label>
                  <input
                    autocomplete="name"
                    class="form-control form-control-lg"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                    type="text"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="registerEmail">Email</label>
                  <input
                    autocomplete="email"
                    class="form-control form-control-lg"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                    type="email"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="registerPassword">Password</label>
                  <input
                    autocomplete="new-password"
                    class="form-control form-control-lg"
                    id="registerPassword"
                    minlength="8"
                    placeholder="At least 8 characters"
                    required
                    type="password"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="confirmPassword">Confirm password</label>
                  <input
                    autocomplete="new-password"
                    class="form-control form-control-lg"
                    id="confirmPassword"
                    minlength="8"
                    placeholder="Re-enter your password"
                    required
                    type="password"
                  />
                </div>
                <p
                  aria-live="polite"
                  class="error-message mb-3"
                  id="registerError"
                  role="alert"
                ></p>
                <button class="btn btn-calix btn-lg w-100" type="submit">
                  Create account
                </button>
                <p class="signup-copy text-center mt-4 mb-0">
                  Already have an account?
                  <button
                    class="btn btn-link signup-link p-0"
                    id="backToLoginButton"
                    type="button"
                  >
                    Sign in
                  </button>
                </p>
              </form>
              <p class="footer-copy mt-auto pt-5 mb-0">
                © 2026 CALIX Glass &amp; Aluminum Fabrication
              </p>
            </div>
          </div>
          <div class="col-lg-7 d-none d-lg-block">
            <div
              class="visual-panel h-100 d-flex flex-column justify-content-between p-5"
            >
              <div class="visual-copy">
                <p class="visual-kicker mb-2">
                  Glass &amp; Aluminum Fabrication
                </p>
                <h2 class="visual-title mb-3">
                  Building a better view
                  <br />
                  of quality service.
                </h2>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../Functions/login.js"></script>
  </body>
</html>
